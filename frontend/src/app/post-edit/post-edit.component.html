<div *ngIf="loading()">Loading...</div>

<div *ngIf="!loading()">
  <a routerLink="/post-edit">← Back to My Posts</a>
  <h2>Edit Post</h2>

  <img [src]="'http://localhost:3000/' + imageUrl()" class="post-image" alt="Post Image" />

  <!-- AI SUGGESTION BOX -->
  <div class="ai-suggestion-box" *ngIf="showAISuggestion()">
    <h3>✨ AI-Generated Description</h3>
    <p>Would you like to use this description?</p>
    <div class="suggestion-text">
      {{ aiSuggestion() }}
    </div>
    <div class="suggestion-buttons">
      <button (click)="useAISuggestion()" class="btn-accept">✓ Use This</button>
      <button (click)="dismissAISuggestion()" class="btn-decline">✕ Dismiss</button>
    </div>
  </div>

  <div class="form-group">
    <div class="label-with-ai">
      <label>Description</label>
      <button
        (click)="generateAIDescription()"
        [disabled]="generatingDescription()"
        class="btn-ai-generate"
        type="button"
      >
        {{ generatingDescription() ? '✨ Generating...' : '✨ Generate with AI' }}
      </button>
    </div>
    <textarea
      [ngModel]="description()"
      (ngModelChange)="description.set($event)"
      name="description"
    ></textarea>
  </div>

  <div class="form-group">
    <label>Location</label>
    <input
      type="text"
      [ngModel]="location()"
      (ngModelChange)="location.set($event)"
      name="location"
    />
  </div>

  <button (click)="save()">Save</button>
  <button (click)="cancel()">Cancel</button>
</div>
